name: OrangeFox - Build

# Credits to:
# https://github.com/TeamWin
# https://gitlab.com/OrangeFox
# https://github.com/azwhikaru for Recovery Builder Template
# And all Contributors in every repositories I used

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
        type: choice
        options:
        - 12.1
        - 11.0
      DEVICE_TREE:
        description: 'OrangeFox Device Tree'
        required: false
        default: 'https://git.thinh2701p.xyz/thinhzero/android_device_xiaomi_thyme.git'
      DEVICE_TREE_BRANCH:
        description: 'OrangeFox Device Tree Branch'
        required: false
        default: 'fox_12.1'
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: false
        default: 'device/xiaomi/thyme'
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: false
        default: 'thyme'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'boot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot

jobs:
  build:
    name: Build OFR by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Defaults only: any nonempty workflow input takes precedence.
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH || '12.1' }}
      DEVICE_TREE: ${{ inputs.DEVICE_TREE || 'https://git.thinh2701p.xyz/thinhzero/android_device_xiaomi_thyme.git' }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH || 'fox_12.1' }}
      DEVICE_PATH: ${{ inputs.DEVICE_PATH || 'device/xiaomi/thyme' }}
      DEVICE_NAME: ${{ inputs.DEVICE_NAME || 'thyme' }}
      BUILD_TARGET: ${{ inputs.BUILD_TARGET || 'boot' }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
              
    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24
      
    - name: Build Environment
      run: |
        set -euo pipefail
        sudo apt install aria2 -y
        # Keep upstream setup separate from this repository's scripts/ tools.
        setup_dir="$(mktemp -d "${RUNNER_TEMP}/orangefox-setup.XXXXXX")"
        git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master "$setup_dir"
        cd "$setup_dir"
        sudo bash setup/android_build_env.sh
      
    - name: Set-up Manifest
      if: env.MANIFEST_BRANCH == '11.0' || env.MANIFEST_BRANCH == '12.1'
      run: |
        mkdir -p "${GITHUB_WORKSPACE}/OrangeFox"
        cd "${GITHUB_WORKSPACE}/OrangeFox"
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git -b master
        cd sync
        ./orangefox_sync.sh --branch "$MANIFEST_BRANCH" --path "${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}"

    - name: Clone Device Tree
      run: |
        cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}"
        git clone "$DEVICE_TREE" -b "$DEVICE_TREE_BRANCH" "./${DEVICE_PATH}"
        cd "$DEVICE_PATH"
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
        if [[ "$DEVICE_NAME" == "thyme" && -f prebuilt/pixelos/manifest.json ]]; then
          python3 -c 'import json; assert json.load(open("prebuilt/pixelos/manifest.json"))["profile"] == "PixelOS17-boot-test"'
          [[ "$BUILD_TARGET" == "boot" ]] || { echo 'PixelOS boot-test only supports BUILD_TARGET=boot'; exit 1; }
          echo 'THYME_BOOT_TEST=1' >> "$GITHUB_ENV"
        fi

    - name: Restore strict-build source dependencies
      if: env.THYME_BOOT_TEST == '1'
      run: |
        set -euo pipefail
        [[ "$MANIFEST_BRANCH" == 12.1 ]]
        cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}"
        # The minimal manifest removes this project, but HIDL's Soong load hook
        # still creates VTS fuzz modules referring to its real cc_defaults.
        # Restore the matching AOSP source; do not stub the module or allow
        # missing dependencies. These test modules are not recovery packages.
        git clone --depth 1 --branch android-12.1.0_r4 \
          https://android.googlesource.com/platform/test/vts-testcase/fuzz \
          test/vts-testcase/fuzz
        [[ "$(git -C test/vts-testcase/fuzz rev-parse HEAD)" == 6148b27ab136ae012e97fdeae96978edcb5ca7b7 ]]
        grep -q 'name: "vts_proto_fuzzer_default"' test/vts-testcase/fuzz/iface_fuzzer/Android.bp
        [[ -f test/vts/proto/Android.bp && -d external/llvm/lib/Fuzzer ]]
        # The retained neuralnetworks HAL utilities also inherit defaults from
        # a project removed by the minimal manifest. Keep its real definitions.
        git clone --depth 1 --branch android-12.1.0_r4 \
          https://android.googlesource.com/platform/packages/modules/NeuralNetworks \
          packages/modules/NeuralNetworks
        [[ "$(git -C packages/modules/NeuralNetworks rev-parse HEAD)" == 987db53d74e02ab01abdb0db36eb8ccea00e2548 ]]
        grep -q 'name: "neuralnetworks_utils_defaults"' packages/modules/NeuralNetworks/common/Android.bp
        # Framework test declarations inherit these root CTS defaults even for
        # bootimage. Sparse checkout keeps the actual defaults and annotation
        # library, plus the cts-tradefed harness used by ADB FastDeployHostTests.
        # GkiInstallTest also references the original CTS host runner utilities.
        # Preserve its wrapper/resources/DynamicConfig, not unrelated CTS tests.
        git clone --filter=blob:none --no-checkout --depth 1 --branch android-12.1.0_r4 \
          https://android.googlesource.com/platform/cts cts
        [[ "$(git -C cts rev-parse HEAD)" == 5c5a1cac99f23a61564c60be33f9274ff7fcd5fa ]]
        git -C cts sparse-checkout set --no-cone --stdin <<'CTS_HARNESS_PATHS'
        /Android.bp
        /tools/cts-tradefed/Android.bp
        /tools/cts-tradefed/etc/
        /tools/cts-tradefed/res/
        /tools/cts-tradefed/DynamicConfig.xml
        /tools/cts-tradefed/OWNERS
        /tools/cts-tradefed/README
        /hostsidetests/utils/
        CTS_HARNESS_PATHS
        git -C cts checkout --detach HEAD
        grep -q 'name: "cts_defaults"' cts/Android.bp
        grep -q 'name: "cts-tradefed"' cts/tools/cts-tradefed/Android.bp
        grep -q 'name: "cts-tradefed-harness"' cts/tools/cts-tradefed/Android.bp
        [[ -x cts/tools/cts-tradefed/etc/cts-tradefed && -d cts/tools/cts-tradefed/res ]]
        [[ -f cts/tools/cts-tradefed/DynamicConfig.xml ]]
        grep -q 'name: "cts-host-utils"' cts/hostsidetests/utils/Android.bp
        [[ -f cts/hostsidetests/utils/src/android/cts/host/utils/DeviceJUnit4Parameterized.java ]]
        [[ -f cts/hostsidetests/utils/src/android/cts/host/utils/DeviceJUnit4ClassRunnerWithParameters.java ]]
        grep -q 'android.RegisterModuleType("tradefed_binary_host"' build/soong/tradefed/suite_harness/tradefed_binary.go
        git clone --filter=blob:none --no-checkout --depth 1 --branch android-12.1.0_r4 \
          https://android.googlesource.com/platform/platform_testing platform_testing
        [[ "$(git -C platform_testing rev-parse HEAD)" == af7eaff31e0aed03c06f6bade385397d792f4008 ]]
        git -C platform_testing sparse-checkout set --no-cone /libraries/annotations/
        git -C platform_testing checkout --detach HEAD
        grep -q 'name: "platform-test-annotations"' platform_testing/libraries/annotations/Android.bp
        # Tethering coverage tests inherit a real java_defaults from NetworkStack
        # tests/unit/Android.bp, not from the project's root Android.bp.
        git clone --depth 1 --branch android-12.1.0_r4 \
          https://android.googlesource.com/platform/packages/modules/NetworkStack \
          packages/modules/NetworkStack
        [[ "$(git -C packages/modules/NetworkStack rev-parse HEAD)" == ae471a43f6198859028f3f987c72aa17ae890ff1 ]]
        grep -q 'name: "libnetworkstackutilsjni_deps"' packages/modules/NetworkStack/tests/unit/Android.bp
        [[ -f packages/modules/NetworkStack/tests/unit/jni/Android.bp ]]
        grep -q 'name: "framework-connectivity-test-defaults"' packages/modules/Connectivity/tests/common/Android.bp
        # Retained Harmony JDWP tests depend on JUnit; JUnit statically includes
        # Hamcrest. Restore both source projects, not jars or placeholder modules.
        git clone --depth 1 --branch android-12.1.0_r4 \
          https://android.googlesource.com/platform/external/junit external/junit
        [[ "$(git -C external/junit rev-parse HEAD)" == 7c5c0ba1f123304da6f14f9d34d83b89851ccda2 ]]
        grep -q 'name: "junit"' external/junit/Android.bp
        git clone --depth 1 --branch android-12.1.0_r4 \
          https://android.googlesource.com/platform/external/hamcrest external/hamcrest
        [[ "$(git -C external/hamcrest rev-parse HEAD)" == b6b17dc33ec3cfffb9bc227e14c3042626c08f4e ]]
        grep -q 'name: "hamcrest"' external/hamcrest/hamcrest-core/Android.bp
        # Retained VTS Tradefed tests statically depend on EasyMock. Restore its
        # original source/host variant and license, not a prebuilt or fake module.
        git clone --depth 1 --branch android-12.1.0_r4 \
          https://android.googlesource.com/platform/external/easymock external/easymock
        [[ "$(git -C external/easymock rev-parse HEAD)" == 51beb6618fd32fa0f2d51082f04c80c07c8677c9 ]]
        grep -q 'name: "easymock"' external/easymock/Android.bp
        grep -q 'name: "easymocklib"' external/easymock/Android.bp
        [[ -f external/easymock/src/org/easymock/EasyMock.java ]]
        [[ -f external/easymock/LICENSE.txt && -f external/easymock/NOTICE ]]
        # dx-docs needs Doclava's SDK templates. Its root Android.bp also declares
        # Java libraries, so restore their real source dependency chain together.
        # Keep ErrorProne's upstream JARs AND Soong plugin; do not stub annotations
        # or alter compiler checks to get through dependency resolution.
        while read -r project revision; do
          git clone --depth 1 --branch android-12.1.0_r4 \
            "https://android.googlesource.com/platform/external/${project}" "external/${project}"
          [[ "$(git -C "external/${project}" rev-parse HEAD)" == "$revision" ]]
        done <<'DOCLAVA_PROJECTS'
        doclava 0f582d0d69044f28b50aad2de59bd6f8673a5027
        jsilver 3092867230f876bb6459261ceceac687ef58d9c5
        guava 9b79d654ebb1a2adf1caafbaa7029c5252f74f1b
        antlr b3332f240724bb50d4387aca9a5ecbaf713df8d0
        tagsoup 4c3e83b5676516de4ee40e61884f86020cbe44c1
        jsr305 ef7ea7b4611582d4c3cd14b868694bab8604a670
        error_prone aa48ec720e6665859f4442850b1988791df2af18
        DOCLAVA_PROJECTS
        grep -q 'name: "droiddoc-templates-sdk"' external/doclava/Android.bp
        [[ -d external/doclava/res/assets/templates-sdk ]]
        grep -q 'name: "error_prone_annotations"' external/error_prone/Android.bp
        grep -q 'name: "soong-java-config-error_prone"' external/error_prone/soong/Android.bp
        [[ -f external/error_prone/error_prone/error_prone_annotations-2.4.0.jar ]]
        # Retained framework/MediaProvider compiler checks use Auto Service.
        # Keep its root license/package and complete common/service subtrees,
        # without pulling unrelated AutoValue/AutoFactory processor projects.
        git clone --filter=blob:none --no-checkout --depth 1 --branch android-12.1.0_r4 \
          https://android.googlesource.com/platform/external/auto external/auto
        [[ "$(git -C external/auto rev-parse HEAD)" == 40f6e33309de080c50ade433c4a7fc08a7c9d853 ]]
        git -C external/auto sparse-checkout set --no-cone \
          /Android.bp /LICENSE /METADATA /MODULE_LICENSE_APACHE2 /README.md /.gitignore /common/ /service/
        git -C external/auto checkout --detach HEAD
        grep -q 'name: "external_auto_license"' external/auto/Android.bp
        grep -q 'name: "auto_common"' external/auto/common/Android.bp
        grep -q 'name: "auto_service_annotations"' external/auto/service/Android.bp
        grep -q 'name: "auto_service_plugin"' external/auto/service/Android.bp
        grep -q 'processor_class: "com.google.auto.service.processor.AutoServiceProcessor"' external/auto/service/Android.bp
        [[ -f external/auto/service/processor/src/main/java/com/google/auto/service/processor/AutoServiceProcessor.java ]]
        [[ -f external/auto/LICENSE ]]
        # auto_common depends on the original JavaPoet library and retained Guava.
        git clone --depth 1 --branch android-12.1.0_r4 \
          https://android.googlesource.com/platform/external/javapoet external/javapoet
        [[ "$(git -C external/javapoet rev-parse HEAD)" == 6458e0481b8e78a562805da73c016e8772755e31 ]]
        grep -q 'name: "javapoet"' external/javapoet/Android.bp
        [[ -f external/javapoet/src/main/java/com/squareup/javapoet/JavaFile.java ]]
        [[ -f external/javapoet/LICENSE.txt ]]
        grep -q 'name: "guava"' external/guava/Android.bp
        # Metalava's Kotlin sources need the actual compiler as well as stdlib
        # modules. fs_mgr's retained host tests use the upstream Tradefed import.
        git clone --depth 1 --branch android-12.1.0_r4 \
          https://android.googlesource.com/platform/external/kotlinc external/kotlinc
        [[ "$(git -C external/kotlinc rev-parse HEAD)" == 5a266bf3adea01dbf7c5453e240333446eeee8cc ]]
        grep -q 'name: "kotlin-reflect"' external/kotlinc/Android.bp
        [[ -x external/kotlinc/bin/kotlinc && -f external/kotlinc/lib/kotlin-compiler.jar ]]
        git clone --depth 1 --branch android-12.1.0_r4 \
          https://android.googlesource.com/platform/tools/tradefederation/prebuilts tools/tradefederation/prebuilts
        [[ "$(git -C tools/tradefederation/prebuilts rev-parse HEAD)" == 2a5fd21caf0d161ef6fc2efec1fadf2f31986039 ]]
        grep -q 'name: "tradefed"' tools/tradefederation/prebuilts/test_harness/Android.bp
        [[ -f tools/tradefederation/prebuilts/filegroups/tradefed/tradefed.jar ]]
        # cts-tradefed's explicit dependencies and Soong load-hook libraries
        # are these existing upstream imports, not a new harness implementation.
        for module in tradefed-test-framework loganalysis compatibility-host-util compatibility-tradefed; do
          grep -q "name: \"${module}\"" tools/tradefederation/prebuilts/test_harness/Android.bp
        done
        # Keep the complete Maven subtree, including robolectric.bp included by
        # its Android.bp, plus the root SDK API-version directory declaration
        # and hierarchyviewer's original NetBeans imports and license notice.
        # Other unrelated cloud-client/platform prebuilts are not checked out.
        git clone --filter=blob:none --no-checkout --depth 1 --branch android-12.1.0_r4 \
          https://android.googlesource.com/platform/prebuilts/tools prebuilts/tools
        [[ "$(git -C prebuilts/tools rev-parse HEAD)" == 742ee2c4a94f04fb86ffbc5a72cb6eaa3e9c4ea0 ]]
        git -C prebuilts/tools sparse-checkout set --no-cone \
          /Android.bp /METADATA /.gitignore /common/m2/ /common/api-versions/ /common/netbeans-visual/
        git -C prebuilts/tools checkout --detach HEAD
        grep -q 'name: "metalava-tools-common-m2-deps"' prebuilts/tools/common/m2/Android.bp
        [[ -f prebuilts/tools/common/m2/robolectric.bp ]]
        grep -q 'name: "org-openide-util"' prebuilts/tools/common/netbeans-visual/Android.bp
        grep -q 'name: "org-netbeans-api-visual"' prebuilts/tools/common/netbeans-visual/Android.bp
        [[ -f prebuilts/tools/common/netbeans-visual/org-openide-util.jar ]]
        [[ -f prebuilts/tools/common/netbeans-visual/org-netbeans-api-visual.jar ]]
        [[ -f prebuilts/tools/common/netbeans-visual/NOTICE ]]
        # The Gradle repository is much larger. Restore its unmodified root
        # import and every versioned artifact directory that import declares.
        git clone --filter=blob:none --no-checkout --depth 1 --branch android-12.1.0_r4 \
          https://android.googlesource.com/platform/prebuilts/gradle-plugin prebuilts/gradle-plugin
        [[ "$(git -C prebuilts/gradle-plugin rev-parse HEAD)" == 521e990cdd59af10203ca5cbacb34a89eddc4ed7 ]]
        git -C prebuilts/gradle-plugin sparse-checkout set --no-cone --stdin <<'METALAVA_GRADLE_PATHS'
        /Android.bp
        /METADATA
        /.gitignore
        /com/android/tools/lint/lint-api/30.0.0-alpha14/
        /com/android/tools/lint/lint-checks/30.0.0-alpha14/
        /com/android/tools/lint/lint/30.0.0-alpha14/
        /com/android/tools/lint/lint-gradle/30.0.0-alpha14/
        /com/android/tools/lint/lint-model/30.0.0-alpha14/
        /com/android/tools/common/30.0.0-alpha14/
        /com/android/tools/sdk-common/30.0.0-alpha14/
        /com/android/tools/sdklib/30.0.0-alpha14/
        /com/android/tools/external/org-jetbrains/uast/30.0.0-alpha14/
        /com/android/tools/external/com-intellij/intellij-core/30.0.0-alpha14/
        /com/android/tools/external/com-intellij/kotlin-compiler/30.0.0-alpha14/
        /com/android/tools/repository/30.0.0-alpha14/
        /com/android/tools/build/manifest-merger/30.0.0-alpha14/
        METALAVA_GRADLE_PATHS
        git -C prebuilts/gradle-plugin checkout --detach HEAD
        grep -q 'name: "metalava-gradle-plugin-deps"' prebuilts/gradle-plugin/Android.bp
        # Cross-project imports remain real modules from the retained sources.
        grep -q 'name: "asm-7.0"' prebuilts/misc/common/asm/Android.bp
        grep -q 'name: "platformprotos"' frameworks/base/ProtoLibraries.bp
        grep -q '"ProtoLibraries.bp"' frameworks/base/Android.bp
        # Retained kernel proc-file and development host tests need these real
        # Python libraries. Keep project-root licenses and nested declarations.
        while read -r project revision; do
          git clone --depth 1 --branch android-12.1.0_r4 \
            "https://android.googlesource.com/platform/${project}" "$project"
          [[ "$(git -C "$project" rev-parse HEAD)" == "$revision" ]]
        done <<'PYTHON_VTS_PROJECTS'
        external/python/parse_type c377f51ae22f7a96136d9f83b6f8aa2132dc03eb
        external/ply 0463af9bd0afb0adf7803fd4066d90d163dbe7b1
        external/python/pyfakefs 4a8b5a290814e51105ed0d3297296de0f3c75a9e
        test/vts-testcase/vndk ea6b1eeb118f329ffdaef7120db5bf7adde90ae3
        PYTHON_VTS_PROJECTS
        grep -q 'name: "py-parse_type"' external/python/parse_type/parse_type/Android.bp
        grep -q 'name: "py-ply"' external/ply/ply/Android.bp
        grep -q 'name: "pyfakefs"' external/python/pyfakefs/pyfakefs/Android.bp
        grep -q 'name: "vts_vndk_utils"' test/vts-testcase/vndk/Android.bp
        # The original VNDK project's golden-data genrule references the ABI
        # dump archive. Restore its full input tree, not an empty/dummy ZIP rule.
        git clone --filter=blob:none --no-checkout --depth 1 --branch android-12.1.0_r4 \
          https://android.googlesource.com/platform/prebuilts/abi-dumps/vndk prebuilts/abi-dumps/vndk
        [[ "$(git -C prebuilts/abi-dumps/vndk rev-parse HEAD)" == f3cda30722da4ad96bc305d65367bab02c326380 ]]
        git -C prebuilts/abi-dumps/vndk checkout --detach HEAD
        grep -q 'name: "vndk_abi_dump_zip"' prebuilts/abi-dumps/vndk/Android.bp
        [[ -n "$(find prebuilts/abi-dumps/vndk -type f -name '*.lsdump' -print -quit)" ]]
        # Other VNDK data and Python dependencies come from retained projects.
        grep -q 'name: "vndk_lib_lists"' build/make/target/product/gsi/Android.bp
        grep -q 'name: "vndk_lib_extra_lists"' development/vndk/tools/definition-tool/datasets/Android.bp
        grep -q 'name: "vndk_utils"' test/vts/utils/python/Android.bp
        # Retained audio-policy generators need the real PFW Python libraries,
        # native connector/libraries and schemas declared by its root Blueprint.
        # Keep the full source project, including Asio's original symlink target.
        git clone --depth 1 --branch android-12.1.0_r4 \
          https://android.googlesource.com/platform/external/parameter-framework external/parameter-framework
        [[ "$(git -C external/parameter-framework rev-parse HEAD)" == 2adbdd6b6523793ed33e291b3915fe7f2a704eb5 ]]
        for module in EddParser.py hostConfig.py PFWScriptGenerator.py PfwBaseTranslator.py \
          domainGenerator.py domainGeneratorConnector libparameter libremote-processor libpfw_utility \
          parameter_frameworks_configuration_schemas; do
          grep -Fq "name: \"$module\"" external/parameter-framework/Android.bp
        done
        while read -r input; do
          [[ -f "external/parameter-framework/$input" ]]
        done <<'PFW_INPUTS'
        COPYING.txt
        NOTICE
        upstream/tools/xmlGenerator/EddParser.py
        upstream/tools/xmlGenerator/hostConfig.py
        upstream/tools/xmlGenerator/PFWScriptGenerator.py
        upstream/tools/xmlGenerator/PfwBaseTranslator.py
        upstream/tools/xmlGenerator/domainGenerator.py
        upstream/tools/xmlGenerator/domainGeneratorConnector.cpp
        upstream/schemas/ParameterFrameworkConfiguration.xsd
        upstream/schemas/ConfigurableDomains.xsd
        support/android/asio/asio.hpp
        asio/include/asio/io_service.hpp
        PFW_INPUTS
        [[ -L external/parameter-framework/asio ]]
        [[ "$(readlink external/parameter-framework/asio)" == asio-1.10.6/ ]]
        grep -q 'name: "libxml2"' external/libxml2/Android.bp
        # Retained platform-compat host libraries need BCEL, dexlib2 and the SDK
        # level helper. Restore real sources, including dexlib2's JCommander dep.
        while read -r project revision; do
          git clone --depth 1 --branch android-12.1.0_r4 \
            "https://android.googlesource.com/platform/${project}" "$project"
          [[ "$(git -C "$project" rev-parse HEAD)" == "$revision" ]]
        done <<'COMPAT_JAVA_PROJECTS'
        external/apache-commons-bcel 040b6144329cdd183b1d79998995800f2b9c003f
        external/jcommander 8ce937f3ef2ed68f188cc0637664933a711124de
        COMPAT_JAVA_PROJECTS
        grep -q 'name: "apache-bcel"' external/apache-commons-bcel/Android.bp
        grep -q 'name: "jcommander"' external/jcommander/Android.bp
        [[ -f external/apache-commons-bcel/src/main/java/org/apache/bcel/classfile/ClassParser.java ]]
        [[ -f external/apache-commons-bcel/LICENSE && -f external/apache-commons-bcel/LICENSE.txt && -f external/apache-commons-bcel/NOTICE.txt ]]
        [[ -f external/jcommander/src/main/java/com/beust/jcommander/JCommander.java ]]
        [[ -f external/jcommander/license.txt && -f external/jcommander/notice.md ]]
        # Keep Smali's root license/filegroups and complete dexlib2 subtree;
        # unrelated assembler/disassembler/native tool declarations are not needed.
        git clone --filter=blob:none --no-checkout --depth 1 --branch android-12.1.0_r4 \
          https://android.googlesource.com/platform/external/smali external/smali
        [[ "$(git -C external/smali rev-parse HEAD)" == bb22a92b16eb0453f7f42a540679fad20382b68d ]]
        git -C external/smali sparse-checkout set --no-cone \
          /Android.bp /METADATA /MODULE_LICENSE_BSD /NOTICE /OWNERS /README.md /README.version /.gitignore \
          /build.gradle /scripts/ /dexlib2/
        git -C external/smali checkout --detach HEAD
        grep -q 'name: "dexlib2-no-guava-no-cli"' external/smali/dexlib2/Android.bp
        [[ -f external/smali/dexlib2/src/main/java/org/jf/dexlib2/DexFileFactory.java && -f external/smali/NOTICE ]]
        # The host helper has no dependency on modules-utils' device-side code.
        # Retain its original root package and complete build/testing directory.
        git clone --filter=blob:none --no-checkout --depth 1 --branch android-12.1.0_r4 \
          https://android.googlesource.com/platform/frameworks/libs/modules-utils frameworks/libs/modules-utils
        [[ "$(git -C frameworks/libs/modules-utils rev-parse HEAD)" == 0a8bde0eb27a5de62e73faf9de06a498a4ccec69 ]]
        git -C frameworks/libs/modules-utils sparse-checkout set --no-cone \
          /Android.bp /OWNERS /PREUPLOAD.cfg /TEST_MAPPING /java/com/android/modules/utils/build/testing/
        git -C frameworks/libs/modules-utils checkout --detach HEAD
        grep -q 'name: "modules-utils-build-testing"' frameworks/libs/modules-utils/java/com/android/modules/utils/build/testing/Android.bp
        [[ -f frameworks/libs/modules-utils/java/com/android/modules/utils/build/testing/DeviceSdkLevel.java ]]
        # Remaining dependencies are actual retained/restored imports/libraries.
        grep -q 'name: "commons-cli-1.2"' prebuilts/misc/common/commons-cli/Android.bp
        [[ -f prebuilts/misc/common/commons-cli/commons-cli-1.2.jar ]]
        grep -q 'name: "androidx.annotation_annotation"' prebuilts/sdk/current/androidx/Android.bp
        [[ -f prebuilts/sdk/current/androidx/m2repository/androidx/annotation/annotation/1.3.0-alpha01/annotation-1.3.0-alpha01.jar ]]
        grep -q 'name: "guava"' external/guava/Android.bp
        grep -q 'name: "jsr305"' external/jsr305/Android.bp
        grep -q 'name: "tradefed"' tools/tradefederation/prebuilts/test_harness/Android.bp
        # Retained framework codegen/XML persistence tools use the real parser
        # and symbol solver. Keep generated parser sources and all license files;
        # the solver also needs Javassist and the already restored Guava library.
        while read -r project revision; do
          git clone --depth 1 --branch android-12.1.0_r4 \
            "https://android.googlesource.com/platform/${project}" "$project"
          [[ "$(git -C "$project" rev-parse HEAD)" == "$revision" ]]
        done <<'JAVAPARSER_PROJECTS'
        external/javaparser acd7a527fc44f5e516a50ff61eb1da2ba9272d31
        external/javassist 7bd5da870ec56352887396c1c188350f733e4f3c
        JAVAPARSER_PROJECTS
        grep -q 'name: "javaparser"' external/javaparser/Android.bp
        grep -q 'name: "javaparser-symbol-solver"' external/javaparser/Android.bp
        grep -q 'name: "javassist"' external/javassist/Android.bp
        while read -r input; do
          [[ -f "$input" ]]
        done <<'JAVAPARSER_INPUTS'
        external/javaparser/LICENSE
        external/javaparser/LICENSE.APACHE
        external/javaparser/LICENSE.GPL
        external/javaparser/LICENSE.LGPL
        external/javaparser/javaparser-core/src/main/java/com/github/javaparser/JavaParser.java
        external/javaparser/javaparser-core/generated-sources/javacc/com/github/javaparser/GeneratedJavaParser.java
        external/javaparser/javaparser-symbol-solver-core/src/main/java/com/github/javaparser/symbolsolver/JavaSymbolSolver.java
        external/javassist/LICENSE
        external/javassist/src/main/javassist/ClassPool.java
        JAVAPARSER_INPUTS
        grep -q 'name: "guava"' external/guava/Android.bp

    - name: Diagnose literal source defaults
      if: env.THYME_BOOT_TEST == '1'
      run: |
        set -euo pipefail
        python3 scripts/test-audit-defaults.py
        python3 scripts/audit-defaults.py \
          --source-root "${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}" \
          --report "${GITHUB_WORKSPACE}/source-defaults-report.json"
        python3 scripts/audit-defaults.py \
          --source-root "${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}" \
          --properties libs static_libs shared_libs header_libs whole_static_libs jni_libs tools plugins \
          --report "${GITHUB_WORKSPACE}/source-libraries-report.json"

    - name: Building OrangeFox
      run: |
        set -o pipefail
        cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}"
        export FOX_BUILD_DEVICE="$DEVICE_NAME"
        unset ALLOW_MISSING_DEPENDENCIES SOONG_ALLOW_MISSING_DEPENDENCIES
        set +e
        source build/envsetup.sh
        set -e
        # OrangeFox snapshots exported flags during lunch, not after it.
        if [[ -f "${DEVICE_PATH}/vendorsetup.sh" ]]; then
          source "${DEVICE_PATH}/vendorsetup.sh" "$DEVICE_NAME"
        fi
        unset ALLOW_MISSING_DEPENDENCIES SOONG_ALLOW_MISSING_DEPENDENCIES
        if [[ -f "${DEVICE_PATH}/scripts/check-tree.py" ]]; then
          python3 "${DEVICE_PATH}/scripts/check-tree.py"
        fi
        if [[ "${THYME_BOOT_TEST:-}" == 1 ]]; then
          for test in test-check-tree.py test-prepare-recovery.py test-ramdisk.py; do
            python3 "${DEVICE_PATH}/scripts/$test"
          done
        fi
        lunch "twrp_${DEVICE_NAME}-eng"
        if [[ -f "${DEVICE_PATH}/vendorsetup.sh" ]]; then
          source "${DEVICE_PATH}/vendorsetup.sh" "$DEVICE_NAME"
        fi
        unset ALLOW_MISSING_DEPENDENCIES SOONG_ALLOW_MISSING_DEPENDENCIES
        if [[ "${THYME_BOOT_TEST:-}" == 1 ]]; then
          # Never print/upload fox_env.sh: it may include credentials from CI.
          bash -ec 'source /tmp/thyme/fox_env.sh; [[ "$FOX_VARIANT" == PixelOS17-boot-test && "$FOX_DISABLE_UPDATEZIP" == 1 && "$OF_NO_REFLASH_CURRENT_ORANGEFOX" == 1 ]]; [[ -z "${ALLOW_MISSING_DEPENDENCIES:-}${SOONG_ALLOW_MISSING_DEPENDENCIES:-}" ]]'
        fi
        make clean
        mka adbd "${BUILD_TARGET}image" 2>&1 | tee "${GITHUB_WORKSPACE}/build.log"
        if [[ "$DEVICE_NAME" == "thyme" && "$BUILD_TARGET" == "boot" ]]; then
          python3 "${DEVICE_PATH}/scripts/check-tree.py" \
            --recovery-root "out/target/product/${DEVICE_NAME}/recovery/root" \
            --boot-image "out/target/product/${DEVICE_NAME}/boot.img"
        fi

    - name: Validate published boot-test images
      if: env.THYME_BOOT_TEST == '1'
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}"
        shopt -s nullglob
        out="out/target/product/${DEVICE_NAME}"
        images=("$out"/OrangeFox*.img)
        zips=("$out"/OrangeFox*.zip)
        [[ ${#images[@]} -gt 0 && ${#zips[@]} -eq 0 ]]
        mkdir -p "${GITHUB_WORKSPACE}/boot-test-release"
        for image in "${images[@]}"; do
          cmp "$out/boot.img" "$image"
          python3 "${DEVICE_PATH}/scripts/check-tree.py" \
            --recovery-root "$out/recovery/root" --boot-image "$image"
          cp "$image" "${GITHUB_WORKSPACE}/boot-test-release/"
        done
        cd "${GITHUB_WORKSPACE}/boot-test-release"
        sha256sum -- *.img > SHA256SUMS
        cat > BOOT-TEST.txt <<EOF
        PixelOS 17 / Mi 10S (thyme): temporary fastboot boot test only.
        Device-tree commit: ${COMMIT_ID}
        Build run: ${GITHUB_RUN_ID}
        Do NOT flash this image to boot/vendor_boot or install it using Flash current.
        Keep the matching PixelOS vendor_boot and DTBO unchanged.
        Host/image checks passed; hardware boot, touch, USB and decryption are NOT verified.
        EOF

    - name: Upload build diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-diagnostics-${{ github.run_id }}
        if-no-files-found: ignore
        path: |
          build.log
          source-defaults-report.json
          source-libraries-report.json
          OrangeFox/fox_${{ env.MANIFEST_BRANCH }}/out/error.log
          OrangeFox/fox_${{ env.MANIFEST_BRANCH }}/out/soong.log
          OrangeFox/fox_${{ env.MANIFEST_BRANCH }}/out/verbose.log.gz
          boot-test-release/SHA256SUMS

    - name: Set Release Properties
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Manila date +%Y%m%d)" >> "$GITHUB_ENV"
        cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}"

        DEVICE_TREE_URL="$DEVICE_TREE"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> "$GITHUB_ENV"

    - name: Upload to Release
      if: env.THYME_BOOT_TEST != '1'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          OrangeFox/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.img
          OrangeFox/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.zip
        name: OrangeFox Recovery for ${{ env.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          ## OrangeFox Recovery Build - Unofficial
          Build: fox_${{ env.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ env.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}) during building.

    - name: Publish validated temporary boot-test
      if: env.THYME_BOOT_TEST == '1'
      uses: softprops/action-gh-release@v2
      with:
        fail_on_unmatched_files: true
        files: boot-test-release/*
        prerelease: true
        name: 'OrangeFox thyme PixelOS 17 — BOOT TEST ONLY // ${{ env.BUILD_DATE }}'
        tag_name: ${{ github.run_id }}
        body: |
          **Temporary `fastboot boot` test only. Do not flash/install this image.**
          Keep the matching PixelOS vendor_boot and DTBO; no ZIP installer is supplied.
          Kernel/header/encoded ramdisk/staging checks passed, not hardware boot or decryption.
          Device-tree commit: ${{ env.COMMIT_ID }} (branch `${{ env.DEVICE_TREE_BRANCH }}`).
          Verify the downloaded image using `SHA256SUMS`. See `BOOT-TEST.txt`.
          
