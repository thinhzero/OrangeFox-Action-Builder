name: OrangeFox - Build

# Credits to:
# https://github.com/TeamWin
# https://gitlab.com/OrangeFox
# https://github.com/azwhikaru for Recovery Builder Template
# And all Contributors in every repositories I used

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
        type: choice
        options:
        - 12.1
        - 11.0
      DEVICE_TREE:
        description: 'OrangeFox Device Tree'
        required: false
        default: 'https://git.thinh2701p.xyz/thinhzero/android_device_xiaomi_thyme.git'
      DEVICE_TREE_BRANCH:
        description: 'OrangeFox Device Tree Branch'
        required: false
        default: 'fox_12.1'
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: false
        default: 'device/xiaomi/thyme'
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: false
        default: 'thyme'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'boot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot

jobs:
  build:
    name: Build OFR by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Defaults only: any nonempty workflow input takes precedence.
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH || '12.1' }}
      DEVICE_TREE: ${{ inputs.DEVICE_TREE || 'https://git.thinh2701p.xyz/thinhzero/android_device_xiaomi_thyme.git' }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH || 'fox_12.1' }}
      DEVICE_PATH: ${{ inputs.DEVICE_PATH || 'device/xiaomi/thyme' }}
      DEVICE_NAME: ${{ inputs.DEVICE_NAME || 'thyme' }}
      BUILD_TARGET: ${{ inputs.BUILD_TARGET || 'boot' }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
              
    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24
      
    - name: Build Environment
      run: |
        sudo apt install aria2 -y
        git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
        cd scripts
        sudo bash setup/android_build_env.sh
      
    - name: Set-up Manifest
      if: env.MANIFEST_BRANCH == '11.0' || env.MANIFEST_BRANCH == '12.1'
      run: |
        mkdir -p "${GITHUB_WORKSPACE}/OrangeFox"
        cd "${GITHUB_WORKSPACE}/OrangeFox"
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git -b master
        cd sync
        ./orangefox_sync.sh --branch "$MANIFEST_BRANCH" --path "${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}"

    - name: Clone Device Tree
      run: |
        cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}"
        git clone "$DEVICE_TREE" -b "$DEVICE_TREE_BRANCH" "./${DEVICE_PATH}"
        cd "$DEVICE_PATH"
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

    - name: Building OrangeFox
      run: |
        cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}"
        export FOX_BUILD_DEVICE="$DEVICE_NAME"
        unset ALLOW_MISSING_DEPENDENCIES SOONG_ALLOW_MISSING_DEPENDENCIES
        set +e
        source build/envsetup.sh
        set -e
        if [[ -f "${DEVICE_PATH}/scripts/check-tree.py" ]]; then
          python3 "${DEVICE_PATH}/scripts/check-tree.py"
        fi
        lunch "twrp_${DEVICE_NAME}-eng"
        if [[ -f "${DEVICE_PATH}/vendorsetup.sh" ]]; then
          source "${DEVICE_PATH}/vendorsetup.sh" "$DEVICE_NAME"
        fi
        make clean
        mka adbd "${BUILD_TARGET}image"
        if [[ "$DEVICE_NAME" == "thyme" && "$BUILD_TARGET" == "boot" ]]; then
          python3 "${DEVICE_PATH}/scripts/check-tree.py" \
            --recovery-root "out/target/product/${DEVICE_NAME}/recovery/root" \
            --boot-image "out/target/product/${DEVICE_NAME}/boot.img"
        fi

    - name: Set Release Properties
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Manila date +%Y%m%d)" >> "$GITHUB_ENV"
        cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}"

        DEVICE_TREE_URL="$DEVICE_TREE"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> "$GITHUB_ENV"

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          OrangeFox/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.img
          OrangeFox/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.zip
        name: OrangeFox Recovery for ${{ env.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          ## OrangeFox Recovery Build - Unofficial
          Build: fox_${{ env.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ env.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}) during building.
          
